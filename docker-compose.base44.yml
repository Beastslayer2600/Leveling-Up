# Base44 sandbox setup. Runs the Vite dev server from the cloned source so edits
# show up live. The app's own /api/* routes are served in-process by
# server/dev.ts with an in-memory Postgres (PGlite), so no database service is
# needed here; the production Neon path (DATABASE_URL) is never used in preview.
services:
  web:
    image: node:22
    working_dir: /app
    ports:
      - "3000:5173"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    environment:
      - BASE44_PREVIEW_MODE
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
    env_file:
      # Platform-managed secrets (AUTH_SECRET, optional ANTHROPIC_API_KEY).
      - /run/base44/app.env
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"]
    restart: on-failure
    healthcheck:
      # Both the page and the dev API must answer: the SPA is useless without /api.
      test:
        - CMD
        - node
        - -e
        - |
          const check = async () => {
            const page = await fetch("http://127.0.0.1:5173/");
            if (!page.ok) throw new Error("web " + page.status);
            const api = await fetch("http://127.0.0.1:5173/api/auth");
            if (!api.ok) throw new Error("api " + api.status);
          };
          check().then(() => process.exit(0)).catch((e) => {
            console.error(e.message);
            process.exit(1);
          });
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  web_node_modules:
